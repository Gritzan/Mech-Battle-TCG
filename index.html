<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MechBattle</title>
<style>
:root{box-sizing:border-box;--bg:#f1f3f7;--pn:#fff;--tx:#1b1f27;--mu:#667085;--bd:#cbd2de;--ac:#2563eb}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1219;--pn:#1a1f2b;--tx:#e6e9f0;--mu:#98a2b3;--bd:#343c4e;--ac:#5b8def}}
:root[data-theme="dark"]{--bg:#0f1219;--pn:#1a1f2b;--tx:#e6e9f0;--mu:#98a2b3;--bd:#343c4e;--ac:#5b8def}
*{box-sizing:inherit}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif;text-align:center}
h1{font-size:44px;margin:0}p{color:var(--mu)}
.b{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-top:24px}
a{display:block;width:230px;padding:28px 12px;border:2px solid var(--bd);border-radius:14px;background:var(--pn);color:var(--tx);text-decoration:none;font-size:20px;font-weight:700}
a:hover{border-color:var(--ac)}a small{display:block;font-weight:400;color:var(--mu);font-size:13px;margin-top:6px}
</style></head><body>
<main><h1>MechBattle</h1><p>Virtual tabletop</p>
<div class="b"><a href="play.html">▶ Play<small>Start or join a match</small></a><a href="deckbuilder.html">🛠 Deck Builder<small>Build, save and export decks</small></a></div></main>
